    milestone_ids:
    - milestone-006
    description: Memory-mapped or explicitly approved V4L2 buffer lifecycle.
    acceptance_criteria:
    - Implement pure Rust capture for the selected V4L2 mode, configure and safely
      return streaming buffers, and write bounded timestamped segments that are complete
      and readable before publication. Handle malformed frames, shutdown, disconnect,
      and reconnect without corrupting completed artifacts. Apply backpressure at
      the spool boundary and publish through the same Taytay Artifact, spool, and
      upload path used by MVP1, without application-specific upload logic.
