---
name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v2
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: 'Quality gate: declared_cargo_fmt'
      run: cargo fmt --all -- --check
    - name: 'Quality gate: declared_cargo_check'
      run: cargo check --workspace --all-targets --all-features
    - name: 'Quality gate: declared_cargo_test'
      run: cargo test --workspace --all-features
    - name: 'Quality gate: declared_cargo_llvm_cov'
      run: cargo llvm-cov --workspace --all-features --fail-under-lines 90
    - name: 'Quality gate: declared_cargo_clippy'
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: 'Quality gate: declared_quality'
      run: scripts/quality.sh
    - name: 'Quality gate: declared_acceptance_mock'
      run: scripts/acceptance-mock.sh
    - name: 'Quality gate: documentation_links'
      run: bin/ci documentation_links
    - name: 'Quality gate: documentation_navigation'
      run: bin/ci documentation_navigation
    - name: 'Quality gate: documentation_redaction'
      run: bin/ci documentation_redaction
    - name: 'Quality gate: mermaid_validation'
      run: bin/ci mermaid_validation
    - name: 'Quality gate: zensical_build'
      run: bash -lc source\ .venv-zensical/bin/activate\ \&\&\ zensical\ build\ --clean\
        --strict
