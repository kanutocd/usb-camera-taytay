---
version: '0.1'
project: usb-camera-taytay
repository: "."
gates:
  declared_cargo_fmt:
    argv:
    - cargo
    - fmt
    - "--all"
    - "--"
    - "--check"
    scope: repository
  declared_cargo_check:
    argv:
    - cargo
    - check
    - "--workspace"
    - "--all-targets"
    - "--all-features"
    scope: repository
  declared_cargo_test:
    argv:
    - cargo
    - test
    - "--workspace"
    - "--all-features"
    scope: repository
  declared_cargo_llvm_cov:
    argv:
    - bin/ci
    - declared_cargo_llvm_cov
    scope: repository
  declared_cargo_clippy:
    argv:
    - cargo
    - clippy
    - "--workspace"
    - "--all-targets"
    - "--all-features"
    - "--"
    - "-D"
    - warnings
    scope: repository
  declared_quality:
    argv:
    - scripts/quality.sh
    scope: repository
  declared_acceptance_mock:
    argv:
    - scripts/acceptance-mock.sh
    scope: repository
  documentation_links:
    argv:
    - bin/ci
    - documentation_links
    scope: repository
  documentation_navigation:
    argv:
    - bin/ci
    - documentation_navigation
    scope: repository
  documentation_redaction:
    argv:
    - bin/ci
    - documentation_redaction
    scope: repository
  mermaid_validation:
    argv:
    - bin/ci
    - mermaid_validation
    scope: repository
  zensical_build:
    argv:
    - bin/ci
    - zensical_build
    scope: repository
required_evidence:
- declared_cargo_fmt
- declared_cargo_check
- declared_cargo_test
- declared_cargo_llvm_cov
- declared_cargo_clippy
- declared_quality
- declared_acceptance_mock
- documentation_links
- documentation_navigation
- documentation_redaction
- mermaid_validation
- zensical_build
