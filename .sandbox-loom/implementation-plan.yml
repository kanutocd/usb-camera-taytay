# This plan is derived from normalized-scope.yml. Review it before approval.
# Every slice should pass its quality gates and finish with one coherent Git commit.
# Credentials, secrets, and policy grants do not belong in this file.
---
version: '0.1'
project: usb-camera-taytay
status: proposed
source_scope: ".sandbox-loom/intake-20261020-230819/normalized-scope.yml"
requirements_artifact: ".sandbox-loom/requirements.yml"
objective: Provide a small, reproducible Linux Rust CLI reference application that
  captures or receives local USB-camera media and delivers durable, checksum-bound,
  resumable uploads to Lunsaran through Taytay, while keeping filesystem ingestion
  and pure Rust V4L2 capture as deliberately staged MVPs.
constraints:
  application: One Linux reference application; one configured MVP1 input directory;
    one configured MVP2 V4L2 device.
  cli: Rust CLI; command names and behavior should be consumer-oriented and documented
    before being treated as stable.
  mvp_boundary: MVP1 consumes completed files from an external producer or fixtures;
    MVP2 replaces that producer with a pure Rust V4L2 capture loop.
  artifact_contract: Filesystem and V4L2 source boundaries produce the same Taytay
    Artifact contract; only complete, stable, readable artifacts are emitted.
  durability: Publication is atomic and checksum-bound before upload; the durable
    ledger is authoritative for local job state; the remote TUS offset is authoritative
    for resumable transfer.
  retry: Retries are bounded and classified; permanent authorization or protocol failures
    are not hidden as transport retries.
  upload_boundary: Use published lunsaran-taytay and lunsaran-entregar integrations
    and Taytay ArtifactUploader; no application-specific HTTP or TUS upload path.
  local_tests: Synthetic fixtures and camera-independent tests are required; camera
    hardware is not required for ordinary unit and mock acceptance.
  hardware: MVP2 targets one configured /dev/video* device and initially supports
    one verified pixel format, resolution, and frame interval.
  operations: Keep the application unprivileged and use a narrowly scoped writable
    spool; bound memory, segment size, spool, and capture-to-upload pressure.
  deployment: Local reference application and integration example; no hosted control
    plane or production deployment scope is defined.
quality_gates:
- fmt
- clippy
- unit_tests
- code_coverage
- documentation_links
- documentation_navigation
- documentation_redaction
- mermaid_validation
- zensical_build
assumptions:
- Reference machine runs Linux and exposes a USB camera through V4L2.
- MVP1 may use an external producer such as FFmpeg or GStreamer, but remains valid
  with synthetic files.
- Taytay and the published Entregar crates remain the upload integration boundary.
- A Lunsaran organization, project, and scoped device credential can be provisioned
  for live acceptance; they are not required for ordinary local tests.
- Private Sandbox Loom / sandbox-loom remains available to review and execute the
  project's approved harness workflow.
- Available USB camera has at least one capture mode verifiable with standard V4L2
  inspection tools.
- Reference app is single-device and single-process for both MVPs.
out_of_scope:
- Build or change Lunsaran, Brutus, or their authorization model.
- Build or change Sandbox Loom itself.
- Hosted control plane, user management, billing, or tenant administration.
- Mobile, Android, iOS, PWA, or browser camera clients.
- Cloud storage-provider credentials or direct object-storage uploads.
- Video analytics, object detection, facial recognition, or event inference.
- Audio capture, multi-camera synchronization, PTZ control, or camera fleet management.
- Supporting every V4L2 pixel format and codec in the first hardware MVP.
- Guarantee of lossless capture under arbitrary hardware, disk, or network overload.
- Production-grade video analytics.
open_questions: []
