[project.theme]
variant = "classic"
language = "en"
features = ["announce.dismiss", "content.code.annotate", "content.code.copy", "content.code.select", "content.footnote.tooltips", "content.tabs.link", "content.tooltips", "header.autohide", "navigation.expand", "navigation.footer", "navigation.path", "navigation.tracking", "search.highlight"]

[project.theme.icon]
