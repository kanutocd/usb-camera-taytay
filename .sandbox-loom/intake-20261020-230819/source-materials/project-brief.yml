  strategy: Deterministic synthetic and mock acceptance by default; live platform
    and hardware acceptance add evidence when provisioned and available.
  mvp1:
  - Deterministic fixture run showing file stabilization, spool publication, and mock
    upload completion.
  - Tests suppress incomplete files and prevent duplicate logical jobs from repeated
    observations.
  - Restart coverage proves durable jobs resume without data loss.
  - Cover checksum, quota, pause/resume, retry, cancellation, and redaction.
  - Record a real USB-camera-produced file-segment command sequence.
  - Validate successful end-to-end upload against a locally running Lunsaran platform
    using a provisioned test project and scoped device credential; record service
    readiness and result without retaining credentials, signed URLs, or media.
  mvp2:
  - Record device capability and negotiated format without credential leakage.
  - Record capture run with artifact checksums and segment metadata.
  - Test buffer ownership, shutdown, malformed input, disconnect, and reconnect behavior.
  - Maintain hardware matrix entry for available USB camera.
  - Verify capture loop uses same Taytay durable upload path as MVP1.
  test_data: Synthetic media fixtures; no captured media or secrets in committed evidence.
  hardware: Optional for MVP2-specific acceptance; hardware failures are not code-quality
    failures.
risks:
- risk: Files are observed before they are complete.
  impact: Corrupt or partial uploads.
  mitigation: Require atomic rename, completion marker, or repeated stable observations.
- risk: Capture rate exceeds upload or disk capacity.
  impact: Backlog and eventual data loss.
  mitigation: Bound spool, expose pressure, and define retention/backpressure behavior.
- risk: USB camera format is unsupported.
  impact: MVP2 cannot capture.
  mitigation: Inspect capabilities first and support one verified format initially.
- risk: Camera disconnects during a segment.
  impact: Corrupt segment or stalled loop.
  mitigation: Close incomplete output safely and reconnect with bounded backoff.
- risk: Credential or URL leakage.
  impact: Security incident.
  mitigation: Strict file permissions, redaction tests, and secret-free fixtures.
- risk: Local and remote state diverge.
  impact: Duplicate or lost uploads.
  mitigation: Preserve artifact identity, checksum-bound resume state, and durable
    ledger records.
- risk: Hardware-only tests become required for every change.
  impact: Slow or unavailable CI.
  mitigation: Keep MVP1 fixtures and mock acceptance as the default test layer.
- risk: Codec implementation expands scope.
  impact: Delayed MVP2.
  mitigation: Start with one camera-supported format and defer transcoding.
out_of_scope:
- Build or change Lunsaran, Brutus, or their authorization model.
- Build or change Sandbox Loom itself.
- Hosted control plane, user management, billing, or tenant administration.
- Mobile, Android, iOS, PWA, or browser camera clients.
- Cloud storage-provider credentials or direct object-storage uploads.
- Video analytics, object detection, facial recognition, or event inference.
- Audio capture, multi-camera synchronization, PTZ control, or camera fleet management.
- Supporting every V4L2 pixel format and codec in the first hardware MVP.
- Guarantee of lossless capture under arbitrary hardware, disk, or network overload.
- Production-grade video analytics.
assumptions:
- Reference machine runs Linux and exposes a USB camera through V4L2.
- MVP1 may use an external producer such as FFmpeg or GStreamer, but remains valid
  with synthetic files.
- Taytay and the published Entregar crates remain the upload integration boundary.
- A Lunsaran organization, project, and scoped device credential can be provisioned
  for live acceptance; they are not required for ordinary local tests.
- Private Sandbox Loom / sandbox-loom remains available to review and execute the
  project's approved harness workflow.
- Available USB camera has at least one capture mode verifiable with standard V4L2
  inspection tools.
- Reference app is single-device and single-process for both MVPs.
