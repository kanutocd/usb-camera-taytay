- id: implement_scope
  action: coding_agent.cli.request
  after:
  - bootstrap_scope
  with:
    operation: implement
    prompt: Before changing files, select the next incomplete slice from .sandbox-loom/implementation-plan.yml
      and reconcile it with its parent phase, roadmap, requirements, quality gates,
      and applicable ADRs. Treat the executable YAML plan as authoritative over Markdown
      projections. Treat only approved ADRs as binding; proposed ADRs require review
      and must not be silently adopted. If artifacts disagree or are stale, report
      the drift and resolve it through the appropriate plan or documentation update
      before implementation. Implement only the selected bounded slice, update affected
      specifications or ADRs when a public or architectural boundary changes, run
      the slice's listed quality gates, and inspect the final diff. Leave the verified
      change ready for Sandbox Loom's approved runtime commit task. Sandbox Loom passes
      the runtime-selected phase and slice and marks it in_progress before this task
      starts; do not choose a different slice or edit .sandbox-loom/implementation-status.yml.
      If resuming, inspect the current worktree and prior run evidence, preserve valid
      existing work, and continue the same incomplete slice without repeating completed
      tasks. Do not create the final Git commit yourself; Sandbox Loom commits after
      verification and approval, then records the verified commit and completed status.
      Before every patch, reread the current target file and nearby context. If a
      patch does not apply, stop, reread the current file, and construct a new patch
      from its actual contents; never retry the same stale patch or loop on a patch
      mismatch.
    context_files:
    - README.md
    - project-docs/harness/AGENTS.md
