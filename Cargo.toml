[package]
name = "usb-camera-taytay"
version = "0.1.0"
edition = "2024"
description = "Linux USB camera ingestion reference CLI"
license = "MIT"

[dependencies]
lunsaran-taytay = "=0.2.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace]
members = ["."]
resolver = "3"
