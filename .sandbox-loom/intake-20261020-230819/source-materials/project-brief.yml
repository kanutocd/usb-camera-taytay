project: usb-camera-taytay
objective: Provide a small, reproducible Linux Rust CLI reference application that
  captures or receives local USB-camera media and delivers durable, checksum-bound,
  resumable uploads to Lunsaran through Taytay, while keeping filesystem ingestion
  and pure Rust V4L2 capture as deliberately staged MVPs.
harness:
  template: rust-binary
  coding_agent:
    provider: codex
    executable: codex
mvp:
- id: mvp-001
  outcome: MVP1 — Filesystem/file-segment ingestion. Use completed files produced
    by an existing camera or media tool, or synthetic fixtures, and exercise Taytay's
    durable spool and upload path. MVP1 remains valid without a camera or live Lunsaran
    environment for ordinary local tests.
  exit_criteria: A documented command or producer creates synthetic or real media
    segments in one input directory. Only stable, complete, readable files are published,
    once, with stable artifact and source identity, media type, capture time when
    available, metadata, size, and checksum. Source files are not mutated or deleted
    before durable publication and successful upload completion. Uploads use Taytay's
    checksum, retry, resume, bounded-worker, cancellation, and durable-ledger behavior.
    Restart and repeated execution do not lose or duplicate logical uploads. Failures
    remain inspectable and retryable with credentials, signed URLs, and media payloads
    redacted. Acceptance includes deterministic fixture and mock runs, restart and
    failure-path coverage, a real camera-produced file-segment command sequence, and
    validation of a successful end-to-end upload against a locally running Lunsaran
    platform using a provisioned test project and scoped device credential. Record
    service readiness and upload result without retaining credentials, signed URLs,
    or media in evidence.
  milestone_ids:
  - milestone-002
  - milestone-003
  - milestone-004
  feature_ids:
  - MVP1-FS-001
  - MVP1-FS-002
  - MVP1-FS-003
  - MVP1-FS-004
  - MVP1-FS-005
  - MVP1-FS-006
  - MVP1-FS-007
  - MVP1-FS-008
  - MVP1-FS-009
  - MVP1-FS-010
  - DEV-001
  - DEV-002
  - DEV-003
  - DEV-004
  - DEV-005
  - DEV-006
- id: mvp-002
  outcome: MVP2 — Pure Rust V4L2 capture loop. Replace MVP1's external producer with
    a Rust capture loop reading directly from one configured /dev/video* device, while
    retaining the same artifact publication and durable upload boundary.
  exit_criteria: Discover and open a configured device, negotiate a supported capture
    format, resolution, and frame interval, configure streaming buffers and return
    them safely to the driver, and write frames into bounded, timestamped segments
    or another explicitly approved artifact format. Emit only complete, readable artifacts
    and feed the same MVP1 filesystem/spool-to-upload boundary or an equivalent Artifact
    publication boundary without duplicating upload logic. Handle camera disconnect,
    reconnect, malformed frames, and shutdown without corrupting completed artifacts.
    Apply backpressure when the spool is full or upload throughput falls below capture
    throughput. Hardware acceptance records Linux version, camera model, negotiated
    format, segment settings, disconnect/reconnect result, and checksum. MVP2 does
    not require support for every USB camera, arbitrary codecs, audio, multi-camera
    synchronization, or production-grade video analytics.
  milestone_ids:
  - milestone-005
  - milestone-006
  - milestone-007
  feature_ids:
