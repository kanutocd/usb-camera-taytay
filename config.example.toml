# Directories are created by check-config when absent.
input_dir = "./var/input"
spool_dir = "./var/spool"
archive_dir = "./var/archive"
source_id = "usb-camera-1"
spool_quota_bytes = 1073741824

# Optional MVP2 single-frame capture settings. Set these from inspected device
# capabilities before using `run-v4l2`.
# v4l2_device = "/dev/video0"
# v4l2_width = 640
# v4l2_height = 480
# v4l2_pixel_format = "MJPG"
