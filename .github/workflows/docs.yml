name: documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Zensical
        run: |
          python3 -m venv .venv-zensical
          .venv-zensical/bin/python -m pip install --requirement requirements-zensical.txt
      - name: 'Quality gate: documentation_links'
        run: bin/ci documentation_links
      - name: 'Quality gate: documentation_navigation'
        run: bin/ci documentation_navigation
      - name: 'Quality gate: documentation_redaction'
        run: bin/ci documentation_redaction
      - name: 'Quality gate: mermaid_validation'
        run: bin/ci mermaid_validation
      - name: 'Quality gate: zensical_build'
        run: bin/ci zensical_build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
