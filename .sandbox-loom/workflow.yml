  - clippy
  - unit_tests
  - code_coverage
  - documentation_links
  - documentation_navigation
  - documentation_redaction
  - mermaid_validation
  - zensical_build
  repair:
    action: coding_agent.cli.request
    required_paths:
    - bin/ci
    with:
      operation: repair
      prompt: Inspect the persisted quality-gate evidence and repair the failed verification.
        If a configured gate cannot start because the project is not bootstrapped,
        create the declared project structure and the project-owned bin/ci command
        runner before retrying the gates. The runner must implement every configured
        gate with the project's declared language and tools; do not weaken, remove,
        or bypass a quality gate. Implement only this bounded repair, run the affected
        gates, and leave the repository ready for the workflow's verification retry.
        Before every patch, reread the current target file and nearby context. If
        a patch does not apply, stop, reread the current file, and construct a new
        patch from its actual contents; never retry the same stale patch or loop on
        a patch mismatch.
