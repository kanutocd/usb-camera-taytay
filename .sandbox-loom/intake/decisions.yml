- id: tenant-isolation
  title: Tenant isolation
  status: approved
  source: tenancy/isolation
  proposal: Enforce tenant boundaries in application authorization and the persistence
    layer.
  rationale: Cross-tenant access must fail closed even if one enforcement layer is
    bypassed or misconfigured.
  approved_by: Technical lead
  approval_rationale: 'Accepted: enforce tenant boundaries in application authorization
    and persistence so either layer fails closed independently.'
- id: local-development-services
  title: Local development services
  status: approved
  source: development_environment/services
  proposal: Use the declared local orchestration and dependency services as the reproducible
    development boundary.
  rationale: Health checks and disposable local dependencies make setup and verification
    repeatable without production credentials.
  approved_by: Technical lead
  approval_rationale: 'Accepted: use the declared local services as the reproducible
    development boundary; live acceptance remains conditional on provisioned services.'
- id: quality-gates-and-evidence
  title: Quality gates and evidence
  status: approved
  source: quality_expectations/qa
  proposal: Treat the declared quality gates, coverage thresholds, contract tests,
    and E2E expectations as required acceptance evidence.
  rationale: Autonomous changes must be reviewable through deterministic, recorded
    verification results.
  approved_by: QA lead
  approval_rationale: 'Accepted: require the declared deterministic quality gates
    and preserve their evidence for slice acceptance.'
