- id: bootstrap_scope
  action: coding_agent.cli.request
  after:
  - inspect_scope
  required_paths:
  - ".gitignore"
  - bin/ci
  - bin/zensical
  - requirements-zensical.txt
  - ".venv-zensical/bin/activate"
  - ".venv-zensical/bin/zensical"
  - zensical.toml
  - project-docs/index.md
  - project-docs/implementation/status.md
  - project-docs/zensical/stylesheets/mermaid-panzoom.css
  - project-docs/zensical/stylesheets/status-icons.css
  - project-docs/zensical/stylesheets/layout.css
  - project-docs/zensical/javascripts/mermaid.mjs
  - project-docs/zensical/javascripts/mermaid-panzoom.js
  - project-docs/zensical/javascripts/status-icons.js
  - project-docs/zensical/javascripts/tablesort.js
  - Cargo.toml
  with:
    operation: bootstrap
    prompt: 'Bootstrap the declared project before functional implementation. Create
      the template-appropriate project manifest, minimal compilable project entrypoint,
      and project-owned bin/ci command runner. Install every declared project-local
      development dependency with the declared package manager; never rely on a globally
      installed quality tool. Implement every configured quality gate using the declared
      language and tools; do not create a placeholder that bypasses checks. Documentation
      is part of bootstrap: create project-docs/ as the Zensical docs_dir, create
      the required Zensical configuration and project-docs/index.md plus project-docs/implementation/status.md,
      create a pinned requirements-zensical.txt, create .venv-zensical, activate it
      with `source .venv-zensical/bin/activate`, and install the requirements with
      `python -m pip install --requirement requirements-zensical.txt`. Create an executable
      bin/zensical wrapper that sources `.venv-zensical/bin/activate` before invoking
      the activated `.venv-zensical/bin/zensical`; make bin/ci delegate its Zensical
      gate to that wrapper. Verify with `source .venv-zensical/bin/activate && zensical
      build --clean --strict` before leaving bootstrap. Vendor or provision the generated
      project-docs/zensical assets. Ensure node_modules, build output, coverage, virtualenvs,
      and other local caches are ignored. For a single frontend application, do not
      create pnpm-workspace.yaml unless the normalized scope explicitly declares a
      workspace or monorepo. Do not scaffold the declared component files in this
      task; leave those files to their dedicated implementation slice. Run the narrowest
      bootstrap checks and leave the required project files in the repository. Do
      not mark an implementation slice complete for bootstrap work; the runtime records
      task progress in .sandbox-loom/implementation-status.yml. Before every patch,
      reread the current target file and nearby context. If a patch does not apply,
      stop, reread the current file, and construct a new patch from its actual contents;
      never retry the same stale patch or loop on a patch mismatch.'
    context_files:
    - README.md
    - project-docs/harness/AGENTS.md
    - project-docs/harness/ARCHITECTURE.md
    - project-docs/harness/REQUIREMENTS.md
    - project-docs/harness/IMPLEMENTATION.md
