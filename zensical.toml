[project]
site_name = "usb-camera-taytay"
nav = [{ Home = "index.md" }, { Consumer = "audiences/consumer/index.md" }, { Technical = "audiences/technical/index.md" }, { Stakeholder = "audiences/stakeholder/index.md" }]
strict = true
docs_dir = "project-docs"
site_dir = "site"
dev_addr = "127.0.0.1:8000"
extra_javascript = ["zensical/javascripts/mermaid.mjs", "zensical/javascripts/mermaid-panzoom.js", "zensical/javascripts/status-icons.js", "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js", "zensical/javascripts/tablesort.js"]
