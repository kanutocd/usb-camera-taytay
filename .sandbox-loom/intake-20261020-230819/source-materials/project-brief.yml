facts:
- The project is a small Linux reference application and integration example, not
  a hosted camera platform or replacement for Lunsaran authorization/storage.
- The project has two staged MVPs: MVP1 completed-file ingestion and MVP2 pure Rust
    V4L2 capture.
- The application owns local capture/buffering and orchestration; Taytay owns local
  durability and transfer orchestration; Lunsaran owns identity/project authorization;
  Brutus owns TUS transfer and provider execution.
- The public Taytay crate and Entregar client are the upload integration boundary.
- The private Sandbox Loom / sandbox-loom repository remains separate and governs
  intake, policy, workflow, harness, evidence, approvals, and commits.
- Every coherent change should update user-facing documentation and changelog when
  behavior or scope changes.
- Release follows applicable quality and documentation gates and approved Sandbox
  Loom evidence and boundaries when that workflow is used.
proposals:
- proposal: Add MVP2-V4L2-008 for using MVP1's Taytay Artifact publication, durable spool, and upload boundary.
  rationale: Reuse of that boundary is an explicit MVP2 exit criterion, but the source feature list did not have a dedicated feature for it.
  trade_off: This adds a candidate feature for implementation traceability; it does not approve a separate capture or upload architecture.
- proposal: Add MVP1-FS-010 for durable-ledger recovery, bounded retry/resume, and repeated-execution deduplication.
  rationale: These behaviors are explicit MVP1 exit criteria but were not represented by a dedicated feature in the source feature list.
  trade_off: This adds a candidate feature for traceability; it remains subject to stakeholder review like the other source feature IDs.
- proposal: Treat source feature IDs as candidate features pending stakeholder review.
  rationale: The scope statement explicitly says feature IDs are proposals until accepted
    in the implementation brief; the schema has no per-feature status field.
  trade_off: The features remain separately traceable in the features list, while
    this proposal records that their inclusion is not approval.
- proposal: Infer the rust-binary harness template from the single Rust CLI project
    shape.
  rationale: The project skill identifies this as a Rust CLI reference application;
    the intake skill maps a single Rust CLI to rust-binary.
  trade_off: This is an intake inference for review, not a stakeholder-approved harness
    choice.
- proposal: Use the codex CLI as the harness coding agent, with executable codex.
  rationale: The Sandbox Loom intake skill's generated project context selects target
    codex.
  trade_off: Review the execution provider and executable before harness generation;
    no credentials or model are specified here.
